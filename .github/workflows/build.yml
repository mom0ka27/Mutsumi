name: Build

on:
  push:
    branches:
      - '**'
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'scripts/**'
      - 'server/**'
      - '.github/workflows/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
    permissions:
      contents: read
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Flutter
        id: flutter-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/flutter
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ env.FLUTTER_REVISION }}
      - name: Download Flutter
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$(curl --fail --silent --show-error https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 -c 'import json, sys; releases = json.load(sys.stdin); revision = sys.argv[1]; print(next(item["archive"] for item in releases["releases"] if item["hash"] == revision))' "$FLUTTER_REVISION")"
          curl --fail --silent --show-error --location "https://storage.googleapis.com/flutter_infra_release/releases/${archive}" --output flutter.zip
          unzip -q flutter.zip
      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pub-${{ hashFiles('pubspec.lock') }}
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze lib
      - name: Test
        run: flutter test

  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
        working-directory: .
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.30"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  build-android:
    runs-on: ubuntu-latest
    env:
      FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
      ARTIFACT_NAME: Mutsumi-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Flutter
        id: flutter-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/flutter
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ env.FLUTTER_REVISION }}
      - name: Download Flutter
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$(curl --fail --silent --show-error https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 -c 'import json, sys; releases = json.load(sys.stdin); revision = sys.argv[1]; print(next(item["archive"] for item in releases["releases"] if item["hash"] == revision))' "$FLUTTER_REVISION")"
          curl --fail --silent --show-error --location "https://storage.googleapis.com/flutter_infra_release/releases/${archive}" --output flutter.zip
          unzip -q flutter.zip
      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pub-${{ hashFiles('pubspec.lock') }}
      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android ARM64 APK
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: ./scripts/build_android_arm64_apk.sh
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-android
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    env:
      FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
      ARTIFACT_NAME: Mutsumi-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Flutter
        id: flutter-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/flutter
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ env.FLUTTER_REVISION }}
      - name: Download Flutter
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$(curl --fail --silent --show-error https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json | python3 -c 'import json, sys; releases = json.load(sys.stdin); revision = sys.argv[1]; print(next(item["archive"] for item in releases["releases"] if item["hash"] == revision))' "$FLUTTER_REVISION")"
          curl --fail --silent --show-error --location "https://storage.googleapis.com/flutter_infra_release/releases/${archive}" --output flutter.zip
          unzip -q flutter.zip
      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pub-${{ hashFiles('pubspec.lock') }}
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pods-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock') }}
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS IPA
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          flutter build ios --release --no-codesign --dart-define=DANDANPLAY_APP_ID="$DANDANPLAY_APP_ID" --dart-define=DANDANPLAY_APP_SECRET="$DANDANPLAY_APP_SECRET"
          mkdir -p build/ios/ipa build/ios/payload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/payload/Payload/Runner.app
          (
            cd build/ios/payload
            zip -qry ../ipa/Runner.ipa Payload
          )
          rm -rf build/ios/payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-ios
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest
    env:
      FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
      ARTIFACT_NAME: Mutsumi-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Install Flutter
        id: flutter-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/flutter
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ env.FLUTTER_REVISION }}
      - name: Download Flutter
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$(curl --fail --silent --show-error https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json | python3 -c 'import json, sys; releases = json.load(sys.stdin); revision = sys.argv[1]; print(next(item["archive"] for item in releases["releases"] if item["hash"] == revision and "arm64" in item["archive"]))' "$FLUTTER_REVISION")"
          curl --fail --silent --show-error --location "https://storage.googleapis.com/flutter_infra_release/releases/${archive}" --output flutter.zip
          unzip -q flutter.zip
      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pub-${{ hashFiles('pubspec.lock') }}
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            macos/Pods
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-macos-pods-${{ hashFiles('pubspec.lock', 'macos/Podfile.lock') }}
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build macOS ARM64
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: flutter build macos --release --dart-define=DANDANPLAY_APP_ID="$DANDANPLAY_APP_ID" --dart-define=DANDANPLAY_APP_SECRET="$DANDANPLAY_APP_SECRET"
      - name: Package macOS ARM64
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/mutsumi.app"
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/mutsumi")" = "arm64"
          ditto -c -k --sequesterRsrc --keepParent "$app" "mutsumi-macos-arm64.zip"
      - name: Upload macOS ARM64
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-macos-arm64
          path: mutsumi-macos-arm64.zip
          if-no-files-found: error

  build-windows-x64:
    runs-on: windows-latest
    env:
      FLUTTER_REVISION: c9a6c484230f8b5e408ec57be1ef71dee1e77020
      ARTIFACT_NAME: Mutsumi-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${env:GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
      - name: Install Flutter
        id: flutter-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/flutter
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ env.FLUTTER_REVISION }}
      - name: Download Flutter
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json
          $archive = ($releases.releases | Where-Object hash -eq $env:FLUTTER_REVISION | Select-Object -First 1).archive
          if (-not $archive) { throw "Flutter revision not found: $env:FLUTTER_REVISION" }
          Invoke-WebRequest "https://storage.googleapis.com/flutter_infra_release/releases/$archive" -OutFile flutter.zip
          Expand-Archive flutter.zip -DestinationPath .
      - name: Add Flutter to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\flutter\bin"
      - name: Restore Pub cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Pub\Cache
          key: v2-${{ runner.os }}-${{ runner.arch }}-flutter-${{ env.FLUTTER_REVISION }}-pub-${{ hashFiles('pubspec.lock') }}
      - name: Get dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile
      - name: Build Windows x64
        shell: pwsh
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: flutter build windows --release --target-platform=windows-x64 --dart-define=DANDANPLAY_APP_ID="$env:DANDANPLAY_APP_ID" --dart-define=DANDANPLAY_APP_SECRET="$env:DANDANPLAY_APP_SECRET"
      - name: Package Windows x64
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/mutsumi.exe")) { throw "Windows Release bundle not found: $bundle" }
          Compress-Archive -Path "$bundle/*" -DestinationPath mutsumi-windows-x64.zip
      - name: Upload Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-windows-x64
          path: mutsumi-windows-x64.zip
          if-no-files-found: error

  package-server:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: Mutsumi-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Upload server package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-server
          path: server
          if-no-files-found: error
