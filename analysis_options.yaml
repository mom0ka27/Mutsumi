# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Silently dropping a Future is almost always a bug here — playback,
    # storage writes and HTTP calls all depend on ordering.
    unawaited_futures: error
    # Logging goes through AppLogger so it reaches the log files.
    avoid_print: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Correctness
    - avoid_print
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously

    # API hygiene
    - avoid_empty_else
    - prefer_typing_uninitialized_variables
    - sort_child_properties_last

# Deliberately not enabled: directives_ordering, prefer_single_quotes and
# prefer_final_locals. They only flag formatting, and turning them on would
# rewrite most files in the repo for no behavioural gain.
